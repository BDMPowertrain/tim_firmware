name: build

# Builds both images (ADR 0001) and runs the host tests (ADR 0002) on every
# push and pull request to dev. CubeMX never runs here: generated code is
# committed.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  images:
    name: Build both images (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      # Same compiler release the developers build with.
      - name: Install the Arm GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # One configure covers both images. It also fails if the two CubeMX
      # projects name different firmware packages; the link fails if an
      # image exceeds 224 KB.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build the VCU and BMS images
        run: cmake --build --preset ${{ matrix.preset }}

  host-tests:
    name: Host tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The runner's native GCC compiles the logic and the tests.
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # The Data log decoder's check decodes VCU Records with the DBC files
      # through cantools (issue 61); the configure fails without it here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cantools
        run: pip install -r requirements.txt

      # Python is pinned to setup-python's, the one with cantools.
      - name: Configure
        run: cmake --preset host-tests-sanitize -DPython3_EXECUTABLE="$(which python)"

      - name: Build the host tests
        run: cmake --build --preset host-tests-sanitize

      # A failing test, a sanitizer report or an empty test list fails the job.
      - name: Run the host tests
        run: ctest --preset host-tests-sanitize

  message-database:
    name: Message database (generated C is current)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # cantools is pinned in requirements.txt (ADR 0003).
      - name: Install cantools
        run: pip install -r requirements.txt

      # Also fails if a DBC does not load or the per-module frames disagree.
      - name: Regenerate the C from the DBC files
        run: python can/generate.py

      - name: Fail if the committed C differs
        run: |
          if [ -n "$(git status --porcelain -- App/common/logic/can_db)" ]; then
            git status --short -- App/common/logic/can_db
            git diff -- App/common/logic/can_db
            echo "::error::App/common/logic/can_db is stale. Run python can/generate.py and commit the result."
            exit 1
          fi

      # The cell temperature table (issue 62) is generated the same way, from
      # the 33 datasheet points in the script.
      - name: Regenerate the cell temperature table
        run: python App/bms/logic/gen_cell_temp.py

      - name: Fail if the committed table differs
        run: |
          if [ -n "$(git status --porcelain -- App/bms/logic/Src/cell_temp_table.c)" ]; then
            git diff -- App/bms/logic/Src/cell_temp_table.c
            echo "::error::cell_temp_table.c is stale. Run python App/bms/logic/gen_cell_temp.py and commit the result."
            exit 1
          fi
